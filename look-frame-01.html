<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worm Rider — look frame 01</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block}
  #tag{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:11px/1 ui-monospace,Consolas,monospace;
       letter-spacing:.18em;color:rgba(255,235,210,.55);text-transform:uppercase;pointer-events:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="tag">look frame 01 · realtime · no assets</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

/* ------------------------------------------------------------------ noise */
function hash(i,j){
  let n = Math.imul(i,374761393) + Math.imul(j,668265263) | 0;
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16))>>>0) / 4294967295;
}
function n2(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,o){ let s=0,a=.5,t=0; for(let i=0;i<o;i++){ s+=a*n2(x,y); t+=a; x=x*2.03+17.1; y=y*2.03+9.7; a*=.5;} return s/t; }
const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
let _seed=1337; const rnd=()=>{ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; };
const gauss=()=>{ let s=0; for(let i=0;i<4;i++) s+=rnd(); return (s-2)*1.2; };

/* ------------------------------------------------------------------ world */
const WORM = new THREE.Vector3(0,0,720);          // where the worm breaches
const CREST_A = 0.62;                             // dune crest rotation
function dune(x,z){
  const w1=fbm(x*0.0012+3.1,z*0.0012+7.7,3)-.5, w2=fbm(x*0.0012+31.4,z*0.0012+1.3,3)-.5;
  const wx=x+w1*420, wz=z+w2*420;
  const u=(wz*Math.cos(CREST_A)+wx*Math.sin(CREST_A))/270;
  const s=u-Math.floor(u);
  const r = s<0.64 ? Math.pow(s/0.64,1.35) : Math.pow((1-s)/0.36,0.9);
  const dw=Math.hypot(x-WORM.x,z-WORM.z), basin=(0.34+0.66*sstep(220,760,dw))*(1+2.2*sstep(900,3200,dw));
  const amp=(16+52*fbm(x*0.0009+11,z*0.0009+5,2))*basin;
  return r*amp + 80*(fbm(x*0.00035,z*0.00035,2)-.5)*basin + 4*(fbm(x*0.011,z*0.011,2)-.5);
}
const SUN_AZ = -4.5*Math.PI/180, SUN_EL = 7.2*Math.PI/180;
const SUN = new THREE.Vector3(Math.sin(SUN_AZ)*Math.cos(SUN_EL), Math.sin(SUN_EL), Math.cos(SUN_AZ)*Math.cos(SUN_EL));

/* --------------------------------------------------------------- renderer */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.82;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,16/9,2,16000);

/* ------------------------------------------------------- shared GLSL bits */
const ATMO=/*glsl*/`
uniform vec3 uSun;
vec3 horizonCol(vec3 V){
  float g=max(dot(V,uSun),0.);
  vec3 c=mix(vec3(0.40,0.30,0.36),vec3(0.95,0.52,0.26),pow(g,6.));
  return c+vec3(1.4,0.62,0.22)*pow(g,90.)*0.7;
}
vec3 atmo(vec3 col,vec3 wp){
  vec3 d=wp-cameraPosition; float l=length(d);
  float f=1.-exp(-l*0.00030*exp(-max(wp.y,0.)*0.0022));
  return mix(col,horizonCol(d/l),f);
}
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
`;
const U=()=>({uSun:{value:SUN},uTime:{value:0}});

/* -------------------------------------------------------------------- sky */
const sky=new THREE.Mesh(new THREE.SphereGeometry(12000,48,24),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,uniforms:U(),
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:ATMO+/*glsl*/`
  varying vec3 vD;
  void main(){
    vec3 V=normalize(vD); float y=max(V.y,0.);
    vec3 c=mix(horizonCol(V),vec3(0.09,0.16,0.36),1.-exp(-y*3.4));
    float g=max(dot(V,uSun),0.);
    c+=vec3(1.,0.66,0.36)*(pow(g,300.)*0.9+pow(g,2200.)*4.);
    c+=vec3(1.,0.86,0.62)*smoothstep(0.99984,0.99991,g)*55.;
    // thin high cirrus streaks
    float ci=vn(vec2(V.x/(V.y+0.08)*1.2,V.z/(V.y+0.08)*6.))*vn(V.xz*9.+3.);
    c+=vec3(1.,0.62,0.42)*smoothstep(0.34,0.75,ci)*0.22*smoothstep(0.02,0.2,V.y)*(0.4+pow(g,3.));
    gl_FragColor=vec4(c,1.);
  }`}));
sky.renderOrder=-10; scene.add(sky);

/* ----------------------------------------------------------------- terrain */
const N=800, SIZE=6400, X0=-SIZE/2, Z0=-900, D=SIZE/N, NV=N+1;
const H=new Float32Array(NV*NV);
for(let j=0;j<NV;j++) for(let i=0;i<NV;i++) H[j*NV+i]=dune(X0+i*D,Z0+j*D);
const hAt=(fi,fj)=>{ // bilinear in grid space
  if(fi<0||fj<0||fi>=N||fj>=N) return -1e9;
  const i=fi|0,j=fj|0,u=fi-i,v=fj-j,k=j*NV+i;
  return H[k]*(1-u)*(1-v)+H[k+1]*u*(1-v)+H[k+NV]*(1-u)*v+H[k+NV+1]*u*v;
};
const ground=(x,z)=>hAt((x-X0)/D,(z-Z0)/D);
WORM.y=ground(WORM.x,WORM.z);

/* worm spine */
const spinePts=[[-240,-80,40],[-205,0,26],[-150,108,6],[-55,174,-12],[50,168,-20],[126,122,-50],[174,88,-108],[204,58,-170]]
  .map(p=>new THREE.Vector3(WORM.x+p[0],WORM.y+p[1],WORM.z+p[2]));
const spine=new THREE.CatmullRomCurve3(spinePts,false,'catmullrom',0.5);
const R=25, NS=440, NR=64, PLATES=36;
const wormR=u=>{ const g=Math.pow(1-Math.abs(Math.sin(Math.PI*u*PLATES)),5);
  return R*(1-0.11*g)*(1+0.24*sstep(0.9,1,u))*(0.96+0.04*Math.sin(u*40)); };

/* terrain shading: dune self-shadow sweep + worm shadow, baked per vertex */
const pos=new Float32Array(NV*NV*3), nor=new Float32Array(NV*NV*3), shd=new Float32Array(NV*NV);
const sh=Math.hypot(SUN.x,SUN.z), sxg=SUN.x/sh, szg=SUN.z/sh, tanE=SUN.y/sh;
const shadowSamples=[]; for(let i=0;i<=90;i++){ const u=i/90; const p=spine.getPointAt(u); shadowSamples.push([p.x,p.y,p.z,wormR(u)]); }
for(let j=0;j<NV;j++) for(let i=0;i<NV;i++){
  const k=j*NV+i, x=X0+i*D, z=Z0+j*D, h=H[k];
  pos[k*3]=x; pos[k*3+1]=h; pos[k*3+2]=z;
  const hx=(H[j*NV+Math.min(N,i+1)]-H[j*NV+Math.max(0,i-1)])/(2*D);
  const hz=(H[Math.min(N,j+1)*NV+i]-H[Math.max(0,j-1)*NV+i])/(2*D);
  const il=1/Math.hypot(hx,1,hz); nor[k*3]=-hx*il; nor[k*3+1]=il; nor[k*3+2]=-hz*il;
  let occ=0;
  for(let s=1;s<=70;s++){
    const hs=hAt(i+sxg*s,j+szg*s); if(hs<-1e8) break;
    const dd=hs-(h+s*D*tanE); if(dd>0){ occ=Math.max(occ,dd/(1.5+s*D*0.02)); if(occ>=1) break; }
  }
  let lit=1-Math.min(1,occ);
  if(Math.abs(x-WORM.x)<1400 && z>WORM.z-1500 && z<WORM.z+200){
    for(const q of shadowSamples){
      if(q[1]<h) continue;
      const vx=q[0]-x, vy=q[1]-h, vz=q[2]-z, t=vx*SUN.x+vy*SUN.y+vz*SUN.z; if(t<=0) continue;
      const d2=vx*vx+vy*vy+vz*vz-t*t, rr=q[3]*(1+t*0.00035);
      if(d2<rr*rr*1.5){ lit=Math.min(lit, sstep(0.72,1.22,Math.sqrt(d2)/rr)); }
    }
  }
  shd[k]=lit;
}
const idx=new Uint32Array(N*N*6); let q=0;
for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const a=j*NV+i,b=a+1,c=a+NV,d=c+1; idx[q++]=a;idx[q++]=c;idx[q++]=b; idx[q++]=b;idx[q++]=c;idx[q++]=d; }
const tg=new THREE.BufferGeometry();
tg.setAttribute('position',new THREE.BufferAttribute(pos,3));
tg.setAttribute('normal',new THREE.BufferAttribute(nor,3));
tg.setAttribute('aShade',new THREE.BufferAttribute(shd,1));
tg.setIndex(new THREE.BufferAttribute(idx,1));
const sandMat=new THREE.ShaderMaterial({uniforms:U(),
  vertexShader:`attribute float aShade; varying vec3 vW,vN; varying float vS;
    void main(){ vW=position; vN=normal; vS=aShade; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:ATMO+/*glsl*/`
  varying vec3 vW,vN; varying float vS;
  void main(){
    vec3 n=normalize(vN); vec3 Vd=vW-cameraPosition; float dist=length(Vd); vec3 V=Vd/dist;
    // wind ripples, only resolved near the lens
    float near=exp(-dist/260.);
    vec2 wd=normalize(vec2(0.8,0.6));
    float ph=dot(vW.xz,wd)*1.9+vn(vW.xz*0.035)*9.+vn(vW.xz*0.4)*1.2;
    n=normalize(n+vec3(wd.x,0.,wd.y)*cos(ph)*0.22*near+vec3(vn(vW.xz*0.9)-.5,0.,vn(vW.zx*0.9+7.)-.5)*0.12*near);
    float big=vn(vW.xz*0.004)*0.5+vn(vW.xz*0.02)*0.5;
    vec3 alb=mix(vec3(0.74,0.44,0.24),vec3(0.86,0.60,0.36),big);
    float ndl=max(dot(n,uSun),0.);
    float shade=smoothstep(0.,1.,vS);
    vec3 sun=vec3(1.0,0.60,0.33)*5.2;
    vec3 amb=mix(vec3(0.26,0.18,0.26),vec3(0.26,0.29,0.50),n.y*0.5+0.5)*0.40;
    vec3 c=alb*(sun*ndl*shade+amb);
    // forward-scatter sheen: sand glows when you look into a low sun
    vec3 rf=reflect(V,n); float sp=pow(max(dot(rf,uSun),0.),26.);
    c+=vec3(1.0,0.60,0.30)*sp*1.1*shade;
    // glints
    float gl=step(0.9992,h21(floor(vW.xz*14.)))*near*shade*ndl;
    c+=vec3(1.,0.85,0.6)*gl*3.;
    gl_FragColor=vec4(atmo(c,vW),1.);
  }`});
scene.add(new THREE.Mesh(tg,sandMat));

/* -------------------------------------------------------------------- worm */
const frames=spine.computeFrenetFrames(NS,false);
{
  const wp=new Float32Array((NS+1)*(NR+1)*3), wu=new Float32Array((NS+1)*(NR+1)*2);
  const P=new THREE.Vector3(); let k=0,k2=0;
  for(let i=0;i<=NS;i++){ const u=i/NS; spine.getPointAt(u,P); const Nn=frames.normals[i],B=frames.binormals[i];
    for(let j=0;j<=NR;j++){ const a=j/NR*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
      const lump=1+0.025*Math.sin(a*9+u*130)+0.02*Math.sin(a*23-u*310);
      const r=wormR(u)*lump;
      wp[k++]=P.x+r*(ca*Nn.x+sa*B.x); wp[k++]=P.y+r*(ca*Nn.y+sa*B.y); wp[k++]=P.z+r*(ca*Nn.z+sa*B.z);
      wu[k2++]=u; wu[k2++]=j/NR; } }
  const wi=new Uint32Array(NS*NR*6); let w=0;
  for(let i=0;i<NS;i++) for(let j=0;j<NR;j++){ const a=i*(NR+1)+j,b=a+1,c=a+NR+1,d=c+1; wi[w++]=a;wi[w++]=b;wi[w++]=c; wi[w++]=b;wi[w++]=d;wi[w++]=c; }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(wp,3));
  g.setAttribute('uv',new THREE.BufferAttribute(wu,2));
  g.setIndex(new THREE.BufferAttribute(wi,1)); g.computeVertexNormals();
  const m=new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{...U(),uPlates:{value:PLATES}},
    vertexShader:`varying vec3 vW,vN; varying vec2 vUv;
      void main(){ vW=position; vN=normal; vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:ATMO+/*glsl*/`
    varying vec3 vW,vN; varying vec2 vUv; uniform float uPlates;
    void main(){
      vec3 n=normalize(vN); vec3 V=normalize(vW-cameraPosition);
      vec3 c;
      if(!gl_FrontFacing){               // gullet
        float deep=smoothstep(1.0,0.86,vUv.x);
        c=mix(vec3(0.05,0.012,0.008),vec3(0.002,0.001,0.001),deep);
        gl_FragColor=vec4(mix(c,atmo(c,vW),0.3),1.); return;
      }else{
        float groove=pow(1.-abs(sin(3.14159*vUv.x*uPlates)),5.);
        float grain=vn(vec2(vUv.x*900.,vUv.y*60.))*0.6+vn(vec2(vUv.x*220.,vUv.y*400.))*0.4;
        vec3 alb=mix(vec3(0.07,0.05,0.045),vec3(0.22,0.15,0.11),grain);
        alb*=1.-0.75*groove;
        float dusty=smoothstep(0.25,0.9,n.y)*(0.5+0.5*grain);
        alb=mix(alb,vec3(0.55,0.34,0.20),dusty*0.55);
        float ndl=max(dot(n,uSun),0.);
        vec3 amb=mix(vec3(0.50,0.28,0.15),vec3(0.22,0.26,0.46),n.y*0.5+0.5)*0.42;
        c=alb*(vec3(1.0,0.60,0.33)*5.2*ndl+amb);
        float fr=pow(1.-max(dot(n,-V),0.),5.);
        float back=pow(max(dot(V,uSun),0.),2.);
        c+=vec3(1.5,0.70,0.28)*fr*back*1.1*(1.-0.6*groove);
      }
      gl_FragColor=vec4(atmo(c,vW),1.);
    }`});
  scene.add(new THREE.Mesh(g,m));
}
/* simple lit material for teeth + crawlers */
const litMat=(col,rim)=>new THREE.ShaderMaterial({uniforms:{...U(),uCol:{value:new THREE.Color(col)},uRim:{value:rim}},
  vertexShader:`varying vec3 vW,vN; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:ATMO+`varying vec3 vW,vN; uniform vec3 uCol; uniform float uRim;
    void main(){ vec3 n=normalize(vN),V=normalize(vW-cameraPosition);
      vec3 c=uCol*(vec3(1.,0.6,0.33)*5.2*max(dot(n,uSun),0.)+vec3(0.34,0.32,0.46)*0.6);
      c+=vec3(1.5,0.8,0.36)*pow(1.-max(dot(n,-V),0.),3.)*pow(max(dot(V,uSun),0.),2.)*uRim;
      gl_FragColor=vec4(atmo(c,vW),1.); }`});
{
  const toothMat=litMat(0x9a8468,0.35), Y=new THREE.Vector3(0,1,0), P=new THREE.Vector3();
  for(let row=0;row<3;row++){ const u=1-0.022*row-0.004, i=Math.round(u*NS), cnt=34-row*5, L=10-row*2;
    const geo=new THREE.ConeGeometry(2.0-row*0.3,L,6); geo.translate(0,L/2,0);
    spine.getPointAt(u,P); const Nn=frames.normals[i],B=frames.binormals[i],T=frames.tangents[i];
    for(let m=0;m<cnt;m++){ const a=(m+0.5*row)/cnt*Math.PI*2;
      const rad=new THREE.Vector3().addScaledVector(Nn,Math.cos(a)).addScaledVector(B,Math.sin(a));
      const t=new THREE.Mesh(geo,toothMat);
      t.position.copy(P).addScaledVector(rad,wormR(u)*(0.96-0.05*row));
      t.quaternion.setFromUnitVectors(Y,rad.clone().multiplyScalar(-1).addScaledVector(T,0.55+0.2*row).normalize());
      scene.add(t); } }
}
/* crawler caravan fleeing under the head — pure scale cue */
const crawlers=[];
{
  const mat=litMat(0x1c1612,0.8), head=spinePts[spinePts.length-1];
  for(let i=0;i<7;i++){
    const x=WORM.x+110-i*34+gauss()*5, z=WORM.z-150-i*13+gauss()*6, y=ground(x,z);
    const b=new THREE.Mesh(new THREE.BoxGeometry(5,3.4,10),mat); b.position.set(x,y+1.7,z); b.rotation.y=1.2; scene.add(b);
    crawlers.push(b.position.clone());
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(1.1,8,6),new THREE.MeshBasicMaterial({color:new THREE.Color(9,2.2,0.5)})); lamp.position.set(x,y+4.4,z); scene.add(lamp);
  }
}

/* -------------------------------------------------------------------- dust */
{
  const P=[],V=[],A=[],S=[];
  const add=(p,v,acc,phase,rate,s0,s1,alpha)=>{ P.push(p.x,p.y,p.z); V.push(v.x,v.y,v.z); A.push(acc,alpha); S.push(phase,rate,s0,s1); };
  const tmp=new THREE.Vector3(), exit=spine.getPointAt(0.115);            // where the body leaves the sand
  exit.y=ground(exit.x,exit.z);
  for(let i=0;i<1300;i++){                                                // billowing plume
    const a=rnd()*6.283, r=20+rnd()*45;
    add(new THREE.Vector3(exit.x+Math.cos(a)*r,exit.y+rnd()*12,exit.z+Math.sin(a)*r),
        new THREE.Vector3(Math.cos(a)*(30+rnd()*90)-50,70+rnd()*260,Math.sin(a)*(30+rnd()*90)-20),
        -70-rnd()*60, rnd(), 0.035+rnd()*0.04, 22+rnd()*26, 80+rnd()*90, 0.035+rnd()*0.04);
  }
  for(let i=0;i<1400;i++){                                                // ballistic ejecta ring
    const a=rnd()*6.283, r=24+rnd()*14, sp=60+rnd()*150;
    add(new THREE.Vector3(exit.x+Math.cos(a)*r,exit.y,exit.z+Math.sin(a)*r),
        new THREE.Vector3(Math.cos(a)*sp,150+rnd()*330,Math.sin(a)*sp),
        -420, rnd(), 0.10+rnd()*0.07, 7+rnd()*10, 22+rnd()*26, 0.16+rnd()*0.16);
  }
  for(let i=0;i<5200;i++){                                                // sand sheeting off the body
    const u=0.13+Math.pow(rnd(),0.8)*0.72, k=Math.round(u*NS), a=Math.PI*(0.15+rnd()*0.7)*(rnd()<.5?1:-1)+Math.PI;
    spine.getPointAt(u,tmp); const Nn=frames.normals[k],B=frames.binormals[k], r=wormR(u)*(0.75+rnd()*0.3);
    const p=new THREE.Vector3(tmp.x+r*(Math.cos(a)*Nn.x+Math.sin(a)*B.x),tmp.y+r*(Math.cos(a)*Nn.y+Math.sin(a)*B.y),tmp.z+r*(Math.cos(a)*Nn.z+Math.sin(a)*B.z));
    const drop=p.y-ground(p.x,p.z); if(drop<8) continue;
    add(p,new THREE.Vector3(-18+gauss()*6,0,-8+gauss()*6),-drop,rnd(),(0.9+rnd()*0.5)/Math.sqrt(drop/4.9),5+rnd()*5,12+rnd()*18,0.16+rnd()*0.2);
  }
  for(let i=0;i<350;i++){                                                 // low drifting haze in the basin
    const x=WORM.x+gauss()*700, z=WORM.z-250+gauss()*600;
    add(new THREE.Vector3(x,ground(x,z)+4+rnd()*14,z),new THREE.Vector3(-260,6,-90),0,rnd(),0.02+rnd()*0.02,90,160,0.006+rnd()*0.008);
  }
  for(const c of crawlers) for(let i=0;i<60;i++)                           // crawler wakes
    add(new THREE.Vector3(c.x+gauss()*2,c.y+1,c.z+gauss()*2),new THREE.Vector3(60+gauss()*8,10+rnd()*14,20+gauss()*8),0,rnd(),0.25+rnd()*0.2,3,16+rnd()*14,0.10);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('aVel',new THREE.Float32BufferAttribute(V,3));
  g.setAttribute('aAcc',new THREE.Float32BufferAttribute(A,2));
  g.setAttribute('aParm',new THREE.Float32BufferAttribute(S,4));
  g.boundingSphere=new THREE.Sphere(WORM.clone(),4000);
  var dustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{...U(),uScale:{value:1}},
    vertexShader:/*glsl*/`
      attribute vec3 aVel; attribute vec2 aAcc; attribute vec4 aParm;
      uniform float uTime,uScale; varying float vA; varying vec3 vW; varying float vR;
      void main(){
        float life=fract(aParm.x+uTime*aParm.y);
        vec3 p=position+aVel*life+vec3(0.,aAcc.x*life*life,0.);
        p.x+=sin(uTime*0.3+aParm.x*40.)*3.*life;
        vW=p; vR=aParm.x;
        vA=aAcc.y*smoothstep(0.,0.08,life)*smoothstep(1.,0.55,life);
        vec4 mv=viewMatrix*vec4(p,1.);
        gl_PointSize=min(mix(aParm.z,aParm.w,sqrt(life))*uScale/-mv.z,900.);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:ATMO+/*glsl*/`
      varying float vA; varying vec3 vW; varying float vR;
      void main(){
        vec2 c=gl_PointCoord-.5; float r=length(c)*2.; if(r>1.) discard;
        float n=vn(gl_PointCoord*3.5+vR*50.);
        float a=pow(1.-r,1.5)*(0.55+0.9*n)*vA;
        vec3 V=normalize(vW-cameraPosition);
        float g=max(dot(V,uSun),0.);
        vec3 col=mix(vec3(0.30,0.20,0.16),vec3(1.5,0.80,0.36),pow(g,14.))*(0.75+0.35*n);
        gl_FragColor=vec4(atmo(col,vW),a);
      }`});
  const pts=new THREE.Points(g,dustMat); pts.renderOrder=5; scene.add(pts);
}

/* ------------------------------------------------------------------ camera */
let camBase=new THREE.Vector3(-70,0,0), best=-1e9;
for(let x=-260;x<=120;x+=10) for(let z=-160;z<=160;z+=10){ const h=ground(x,z); if(h>best){ best=h; camBase.set(x,h,z); } }
camBase.y+=7.5; camBase.z-=14;
const look=new THREE.Vector3(WORM.x-6,WORM.y+92,WORM.z);

/* -------------------------------------------------------------------- post */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1280,720),0.30,0.7,0.95); composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:/*glsl*/`
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    void main(){
      vec2 d=vUv-.5; float ca=0.004*dot(d,d);
      vec3 c=vec3(texture2D(tDiffuse,vUv-d*ca).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv+d*ca).b);
      c=mix(c,c*c*(3.-2.*c),0.42);
      float l=dot(c,vec3(.3,.59,.11));
      c=mix(c,c*vec3(0.92,0.98,1.12),(1.-l)*0.35);            // cool the shadows
      c*=mix(0.5,1.,smoothstep(0.95,0.2,length(d*vec2(1.,0.85))));
      float n=fract(sin(dot(gl_FragCoord.xy+uTime*61.,vec2(12.9898,78.233)))*43758.5453);
      c+=(n-.5)*0.03;
      gl_FragColor=vec4(c,1.);
    }`});
composer.addPass(grade);

function resize(){
  let w=innerWidth,h=innerHeight; if(w/h>16/9) w=Math.round(h*16/9); else h=Math.round(w*9/16);
  renderer.setSize(w,h); composer.setSize(w,h);
  dustMat.uniforms.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
}
addEventListener('resize',resize); resize();

const mats=[]; scene.traverse(o=>{ if(o.material&&o.material.uniforms&&o.material.uniforms.uTime) mats.push(o.material); });
const t0=performance.now();
function frame(){
  const t=(performance.now()-t0)/1000;
  for(const m of mats) m.uniforms.uTime.value=t; grade.uniforms.uTime.value=t;
  camera.position.set(camBase.x+Math.sin(t*0.11)*9,camBase.y+Math.sin(t*0.17)*1.2,camBase.z+Math.sin(t*0.07)*6);
  camera.lookAt(look.x+Math.sin(t*0.09)*5,look.y,look.z);
  sky.position.copy(camera.position);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
window.__ready=true;
</script>
</body>
</html>
